name: Build CYD_DD Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-v2-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-v2-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Pre-fetch Slow GitHub Release Packages with Curl
        run: |
          mkdir -p ~/.platformio/.cache/downloads
          curl -L --retry 10 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            -C - -o ~/.platformio/.cache/downloads/esptoolpy-v5.1.0.zip \
            https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.1.0.zip || true

      - name: Build Merged Release Firmware
        run: |
          for i in 1 2 3 4 5; do
            pio run -e release -t merged && exit 0
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Show Generated Binaries
        run: find . -name "*.bin"

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: CYD_DD-release-firmware
          include-hidden-files: true
          path: |
            .pio/**/*.bin
            **/*.bin
