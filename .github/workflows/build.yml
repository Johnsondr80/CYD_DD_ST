name: Build CYD_DD Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Merged Release Firmware
        run: pio run -e release -t merged

      - name: Show Generated Binaries
        run: find . -name "*.bin"

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: CYD_DD-release-firmware
          include-hidden-files: true
          path: |
            .pio/build/release/*.bin
            *.bin
            releases/*.bin
            build/*.bin
