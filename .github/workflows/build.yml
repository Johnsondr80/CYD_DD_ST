name: Build CYD_DD Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Merged Release Firmware (with auto-retry)
        run: |
          for i in 1 2 3; do
            pio run -e release -t merged && break
            echo "Attempt $i failed (likely GitHub 504 timeout), retrying in 10s..."
            sleep 10
          done

      - name: Show Generated Binaries
        run: find . -name "*.bin"

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: CYD_DD-release-firmware
          include-hidden-files: true
          path: |
            .pio/build/release/*.bin
            *.bin
            releases/*.bin
            build/*.bin
